services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    image: tp-rabbitmq
    container_name: rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
      - 5672:5672
      - 15672:15672

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    image: tp-gateway
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      GATEWAY_ID: 0

  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    image: tp-client
    container_name: client_0
    depends_on:
      - gateway
    environment:
      SERVER_HOST: gateway
      DATASET_FILE_PATTERNS: frwiki/data/frwiki_namespace_0_{:05}.parquet
      DATASET_FILES_PER_PATTERN: 1
      DATASET_MAX_ROWS: 10
      MAX_BATCH_ROWS: 2
