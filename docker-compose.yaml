x-dataset: &dataset
  DATASET_ROWS_PER_PATTERN: ${DATASET_ROWS_PER_PATTERN:-0}

services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    image: tp-rabbitmq
    container_name: rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
      - ${RABBITMQ_HOST_PORT:-5672}:5672
      - ${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    image: tp-gateway
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      GATEWAY_ID: 0
      CLASSIFIER_AMOUNT: 5
      IMAGE_DOWNLOADER_AMOUNT: 5
      COMPARATOR_AMOUNT: 5

  classifier_0:
    build:
      context: ./src
      dockerfile: nodes/classifier/Dockerfile
    container_name: classifier_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      CLASSIFIER_ID: 0
      CLASSIFIER_AMOUNT: 5

  classifier_1:
