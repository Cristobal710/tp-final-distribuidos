services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    image: tp-rabbitmq
    container_name: rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 50s
    ports:
      - 5672:5672
      - 15672:15672

  gateway:
    build:
      context: ./src
      dockerfile: gateway/Dockerfile
    image: tp-gateway
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      GATEWAY_ID: 0
      CLASSIFIER_AMOUNT: 2
      IMAGE_DOWNLOADER_AMOUNT: 2
      COMPARATOR_AMOUNT: 2

  classifier_0:
    build:
      context: ./src
      dockerfile: nodes/classifier/Dockerfile
    container_name: classifier_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      CLASSIFIER_ID: 0
      CLASSIFIER_AMOUNT: 2

  classifier_1:
    build:
      context: ./src
      dockerfile: nodes/classifier/Dockerfile
    container_name: classifier_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      CLASSIFIER_ID: 1
      CLASSIFIER_AMOUNT: 2

  filter_biography_0:
    build:
      context: ./src
      dockerfile: nodes/filter_biography/Dockerfile
    container_name: filter_biography_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      FILTER_BIOGRAPHY_ID: 0
      FILTER_BIOGRAPHY_AMOUNT: 2
      CLASSIFIER_AMOUNT: 2

  filter_biography_1:
    build:
      context: ./src
      dockerfile: nodes/filter_biography/Dockerfile
    container_name: filter_biography_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      FILTER_BIOGRAPHY_ID: 1
      FILTER_BIOGRAPHY_AMOUNT: 2
      CLASSIFIER_AMOUNT: 2

  image_downloader_0:
    build:
      context: ./src
      dockerfile: nodes/image_downloader/Dockerfile
    container_name: image_downloader_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      IMAGE_DOWNLOADER_ID: 0
      IMAGE_DOWNLOADER_AMOUNT: 2
      FILTER_BIOGRAPHY_AMOUNT: 2

  image_downloader_1:
    build:
      context: ./src
      dockerfile: nodes/image_downloader/Dockerfile
    container_name: image_downloader_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      IMAGE_DOWNLOADER_ID: 1
      IMAGE_DOWNLOADER_AMOUNT: 2
      FILTER_BIOGRAPHY_AMOUNT: 2

  text_processor_0:
    build:
      context: ./src
      dockerfile: nodes/text_processor/Dockerfile
    container_name: text_processor_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TEXT_PROCESSOR_ID: 0
      TEXT_PROCESSOR_AMOUNT: 2
      CLASSIFIER_AMOUNT: 2
      WORD_COUNTER_AMOUNT: 2
      AVERAGE_AMOUNT: 2
      COMPARATOR_AMOUNT: 2

  text_processor_1:
    build:
      context: ./src
      dockerfile: nodes/text_processor/Dockerfile
    container_name: text_processor_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TEXT_PROCESSOR_ID: 1
      TEXT_PROCESSOR_AMOUNT: 2
      CLASSIFIER_AMOUNT: 2
      WORD_COUNTER_AMOUNT: 2
      AVERAGE_AMOUNT: 2
      COMPARATOR_AMOUNT: 2

  average_0:
    build:
      context: ./src
      dockerfile: nodes/average/Dockerfile
    container_name: average_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AVERAGE_ID: 0
      AVERAGE_AMOUNT: 2
      TEXT_PROCESSOR_AMOUNT: 2
      COMPARATOR_AMOUNT: 2

  average_1:
    build:
      context: ./src
      dockerfile: nodes/average/Dockerfile
    container_name: average_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AVERAGE_ID: 1
      AVERAGE_AMOUNT: 2
      TEXT_PROCESSOR_AMOUNT: 2
      COMPARATOR_AMOUNT: 2

  comparator_0:
    build:
      context: ./src
      dockerfile: nodes/comparator/Dockerfile
    container_name: comparator_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      COMPARATOR_ID: 0
      COMPARATOR_AMOUNT: 2
      TEXT_PROCESSOR_AMOUNT: 2

  comparator_1:
    build:
      context: ./src
      dockerfile: nodes/comparator/Dockerfile
    container_name: comparator_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      COMPARATOR_ID: 1
      COMPARATOR_AMOUNT: 2
      TEXT_PROCESSOR_AMOUNT: 2

  word_counter_0:
    build:
      context: ./src
      dockerfile: nodes/word_counter/Dockerfile
    container_name: word_counter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      WORD_COUNTER_ID: 0
      TEXT_PROCESSOR_AMOUNT: 2
      JOIN_Q3_AMOUNT: 1
      TOP20_AMOUNT: 1

  word_counter_1:
    build:
      context: ./src
      dockerfile: nodes/word_counter/Dockerfile
    container_name: word_counter_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      WORD_COUNTER_ID: 1
      TEXT_PROCESSOR_AMOUNT: 2
      JOIN_Q3_AMOUNT: 1
      TOP20_AMOUNT: 1

  join_q3_0:
    build:
      context: ./src
      dockerfile: nodes/join_q3/Dockerfile
    container_name: join_q3_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      JOIN_Q3_ID: 0
      WORD_COUNTER_AMOUNT: 2

  top20_0:
    build:
      context: ./src
      dockerfile: nodes/top20/Dockerfile
    container_name: top20_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      TOP20_ID: 0
      WORD_COUNTER_AMOUNT: 2

  client_0:
    build:
      context: ./src
      dockerfile: client/Dockerfile
    image: tp-client
    container_name: client_0
    depends_on:
      - gateway
    environment:
      SERVER_HOST: gateway
      DATASET_ROWS_PER_PATTERN: 20000
      MAX_BATCH_ROWS: 100
